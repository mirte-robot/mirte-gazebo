---
name: test-yaml-format
on: [push, pull_request]
jobs:
  yaml_style_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
      - run: pip install yamllint --break-system-packages
      - name: check yaml changes
        run: |-
          rm -rf .github/
          yamllint .